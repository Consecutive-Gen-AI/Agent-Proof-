[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof"
version = "0.6.0"
description = "An agent-agnostic verification and evidence layer for software changes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentProof Contributors" }
]
keywords = [
    "ai-agents",
    "verification",
    "evidence",
    "testing",
    "static-analysis",
    "git",
    "code-review",
    "tree-sitter"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
treesitter = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/Consecutive-Gen-AI/agentproof"
Documentation = "https://github.com/Consecutive-Gen-AI/agentproof#readme"
Repository = "https://github.com/Consecutive-Gen-AI/agentproof.git"
Issues = "https://github.com/Consecutive-Gen-AI/agentproof/issues"
Changelog = "https://github.com/Consecutive-Gen-AI/agentproof/blob/main/docs/CHANGELOG.md"

[project.scripts]
agentproof = "agentproof.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
